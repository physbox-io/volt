server {
    listen 8000;
    server_name localhost;

    # circuit.expt.in is a legacy domain still indexed by Google; redirect it
    # permanently to volt.physbox.io instead of just dropping the mapping,
    # so search rankings carry over.
    if ($host = circuit.expt.in) {
        return 301 https://volt.physbox.io$request_uri;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Enable compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
